# XcodeGen project definition — run `xcodegen generate` in this directory.
# Open-source builders: change PRODUCT_BUNDLE_IDENTIFIER and DEVELOPMENT_TEAM
# (or set them in a local xcconfig) before archiving for your own account.
name: Attache
options:
  bundleIdPrefix: io.skynetventures
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QFLKHN7X3F
targets:
  Attache:
    type: application
    platform: iOS
    sources:
      - path: Attache
      - path: Shared
    dependencies:
      - target: AttacheWidgets
      - target: AttacheNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.skynetventures.attache
        INFOPLIST_FILE: Attache/Info.plist
        CODE_SIGN_ENTITLEMENTS: Attache/Attache.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AttacheWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AttacheWidgets
      - path: Shared
      - path: Attache/Theme/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.skynetventures.attache.widgets
        INFOPLIST_FILE: AttacheWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AttacheWidgets/AttacheWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  AttacheNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: AttacheNotificationService
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.skynetventures.attache.notification-service
        INFOPLIST_FILE: AttacheNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: AttacheNotificationService/AttacheNotificationService.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  AttacheTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AttacheTests
    dependencies:
      - target: Attache
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.skynetventures.attache.tests
        GENERATE_INFOPLIST_FILE: YES
